<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 321" width="768" height="321" role="img" aria-labelledby="title">
  <title id="title">Pit-wall terminal: Box box, we have a merge conflict.</title>
  <style>
    text { font: 22px Consolas, "DejaVu Sans Mono", Menlo, monospace; fill: #f3ede0; }
    .title { font-size: 16px; fill: #c4cdd1; }
    .prompt, .radio { fill: #e7b778; }
    .hash { fill: #b8c7ca; }

    /* Covenant's line reveal, with a shared hold before the next pass. */
    .line { animation-duration: 14s; animation-timing-function: linear; animation-iteration-count: infinite; }
    .command { animation-name: command; }
    .commit-one { animation-name: commit-one; }
    .commit-two { animation-name: commit-two; }
    .commit-three { animation-name: commit-three; }
    .commit-four { animation-name: commit-four; }
    .commit-five { animation-name: commit-five; }
    .call { animation-name: call; }
    .reply { animation-name: reply; }
    @keyframes command { 0%, 2% { opacity: 0; transform: translateY(4px); } 4%, 95% { opacity: 1; transform: none; } 98%, 100% { opacity: 0; } }
    @keyframes commit-one { 0%, 5% { opacity: 0; transform: translateY(4px); } 7%, 95% { opacity: 1; transform: none; } 98%, 100% { opacity: 0; } }
    @keyframes commit-two { 0%, 7% { opacity: 0; transform: translateY(4px); } 9%, 95% { opacity: 1; transform: none; } 98%, 100% { opacity: 0; } }
    @keyframes commit-three { 0%, 9% { opacity: 0; transform: translateY(4px); } 11%, 95% { opacity: 1; transform: none; } 98%, 100% { opacity: 0; } }
    @keyframes commit-four { 0%, 11% { opacity: 0; transform: translateY(4px); } 13%, 95% { opacity: 1; transform: none; } 98%, 100% { opacity: 0; } }
    @keyframes commit-five { 0%, 13% { opacity: 0; transform: translateY(4px); } 15%, 95% { opacity: 1; transform: none; } 98%, 100% { opacity: 0; } }
    @keyframes call { 0%, 18% { opacity: 0; transform: translateY(4px); } 20%, 95% { opacity: 1; transform: none; } 98%, 100% { opacity: 0; } }
    @keyframes reply { 0%, 27% { opacity: 0; transform: translateY(4px); } 29%, 95% { opacity: 1; transform: none; } 98%, 100% { opacity: 0; } }
    @media (max-width: 450px) {
      text { font-size: 28px; }
      .title { font-size: 20px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .line { animation: none; }
    }
  </style>
  <rect width="768" height="321" rx="12" fill="#171b1e"/>
  <path d="M12 0h744a12 12 0 0 1 12 12v32H0V12A12 12 0 0 1 12 0Z" fill="#252c30"/>
  <path d="M0 44.5h768" stroke="#3d474d"/>
  <rect x=".5" y=".5" width="767" height="320" rx="11.5" fill="none" stroke="#3d474d"/>
  <circle cx="24" cy="23" r="5" fill="#e7b778"/>
  <circle cx="42" cy="23" r="5" fill="#a6a199"/>
  <circle cx="60" cy="23" r="5" fill="#707c80"/>
  <text x="384" y="29" class="title" text-anchor="middle">pit-wall — zsh</text>
  <text x="29" y="81" class="line command" xml:space="preserve"><tspan class="prompt">➜ </tspan>~ git log --oneline -5</text>
  <text x="29" y="108" class="line commit-one" xml:space="preserve"><tspan class="hash">a1f9c2e</tspan> final fix</text>
  <text x="29" y="135" class="line commit-two" xml:space="preserve"><tspan class="hash">b7d3e01</tspan> final fix (real)</text>
  <text x="29" y="162" class="line commit-three" xml:space="preserve"><tspan class="hash">c4e8a77</tspan> final_final_fix_v2</text>
  <text x="29" y="189" class="line commit-four" xml:space="preserve"><tspan class="hash">d2b6f19</tspan> ok THIS is the final fix</text>
  <text x="29" y="216" class="line commit-five" xml:space="preserve"><tspan class="hash">e9c0a35</tspan> revert "ok THIS is the final fix"</text>
  <text x="29" y="258" class="line call" xml:space="preserve"><tspan class="prompt">➜ </tspan>~ radio --to race-engineer</text>
  <text x="29" y="287" class="line reply" xml:space="preserve"><tspan class="radio">radio: </tspan>Box box, we have a merge conflict.</text>
</svg>
