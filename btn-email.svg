<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 70" width="230" height="70" role="img" aria-label="say hi">
<style>@font-face{font-family:'Hand';src:url(data:font/woff2;base64,) format('woff2')}.b{font-family:'Hand',cursive;font-size:34px}</style>
<defs><filter id="rough" x="-5%" y="-20%" width="110%" height="140%">
<feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7"/>
